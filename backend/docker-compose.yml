# ============================================================
# Stack de production UbiFlow :
#   PostgreSQL + Django/Gunicorn + Nginx (site Angular + reverse proxy)
#
# Démarrage (depuis le dossier backend/) :
#   cp .env.example .env        # puis renseigner les valeurs
#   docker compose up -d --build
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de port publié : PostgreSQL n'est joignable que par le backend.

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media

  planificateur:
    # Tâches planifiées (rappels, escalades, rappels de clôture) : toutes les heures
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - backend
    entrypoint: ["sh", "-c"]
    command: ["while true; do python manage.py taches_planifiees; sleep 3600; done"]
    volumes:
      - media_files:/app/media

  nginx:
    # Image Nginx contenant le site Angular compilé (web/Dockerfile)
    build: ../web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      # Certificats Let's Encrypt (voir README, section HTTPS)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot:/var/www/certbot:ro

volumes:
  postgres_data:
  static_files:
  media_files:
