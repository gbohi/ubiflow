name: ubiflow
description: Application UbiFlow — demandes et validations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Sélecteurs de date en français (lot 7)
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP
  dio: ^5.4.0

  # Storage sécurisé (token JWT)
  flutter_secure_storage: ^9.0.0

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  # Photo de profil (galerie ou appareil photo)
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  # Version épinglée par flutter_localizations : 0.19 (Flutter 3.22) ou 0.20 (récentes)
  intl: '>=0.19.0 <0.21.0'

  # Persistance locale (thème)
  shared_preferences: ^2.2.3

  # Misc
  package_info_plus: 8.0.2

  # Pièces jointes et documents PDF (lot 7)
  file_picker: 8.1.2
  path_provider: ^2.1.3
  open_filex: 4.5.0

  # Notifications push (lot 7) : configuration par --dart-define, voir README
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#092440"
    theme_color: "#5BD988"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    # Icônes Remix, les mêmes que sur le web
    - family: Remixicon
      fonts:
        - asset: assets/fonts/remixicon.ttf
